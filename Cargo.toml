[package]
name = "discord-proceedings-bot-recognizer"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "discord-proceedings-bot の録音を CTranslate2 (faster-whisper と同じエンジン) で文字起こしして議事録 CSV にする"
publish = false

[features]
# GPU で動かすときに有効にする。CUDA Toolkit が要る。
cuda = ["ct2rs/cuda", "ct2rs/cudnn", "ct2rs/cuda-dynamic-loading"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
# CPU の行列演算は oneDNN (dnnl)。faster-whisper の PyPI 版 CTranslate2 も AMD の CPU では
# oneDNN を使う(MKL は Intel の CPU でしか選ばれない)ので、同じ計算経路になる。
ct2rs = { version = "0.10.3", default-features = false, features = ["dnnl", "openmp-runtime-comp"] }
env_logger = "0.11"
flate2 = "1"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "rustls-tls"] }
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
log = "0.4"
ogg = "0.9"
opus = "0.4"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 無音を取り除く Silero VAD(ONNX)を動かす。純 Rust なので、C++ のビルドもランタイムのダウンロードも増えない。
tract-onnx = { version = "0.23.9", default-features = false }
# 正規表現は純 Rust の fancy-regex を使う(onig だと C のライブラリのビルドが増える)
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
